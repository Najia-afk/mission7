# =============================================================================
# Mission7 CI/CD Pipeline
# =============================================================================
#
# Triggers:
#   - Push to main → Full pipeline (test + build + deploy)
#   - Pull request to main → Test + build only
#
# Architecture:
#   GitHub → Tests → Build → Deploy to Lightsail
#                          → git pull
#                          → docker compose up
#                          → Model served from prod_models/
#
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ===========================================================================
  # JOB 1: Run Tests (pytest)
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlruns.db"
          DB_PATH: "./dataset/home_credit.db"
          USE_POSTGRES: "false"
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # JOB 2: Build Docker Images
  # ===========================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mission7-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker build
        run: |
          docker build -t mission7-api:test .
          docker run --rm mission7-api:test python -c "import flask; import mlflow; print('✅ Docker build OK')"

  # ===========================================================================
  # JOB 3: Deploy to Lightsail
  # ===========================================================================
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ vars.LIGHTSAIL_HOST != '' }}
        with:
          host: ${{ vars.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd /opt/mission7
            
            # Pull latest code from main
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            # Stop existing containers gracefully
            echo "🛑 Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            
            # Build and start with new code
            echo "🔨 Building and starting containers..."
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Verify deployment
            echo "✅ Checking service health..."
            docker compose -f docker-compose.prod.yml ps
            
            # Health check
            curl -f http://localhost/api/health || echo "⚠️ Health check failed, but continuing..."
            
            echo "🎉 Deployment complete!"
      
      - name: Health check (external)
        if: ${{ vars.LIGHTSAIL_HOST != '' }}
        run: |
          echo "Waiting for services to stabilize..."
          sleep 30
          echo "Checking API health..."
          curl -f http://${{ vars.LIGHTSAIL_HOST }}/api/health && echo "✅ API is healthy!" || echo "⚠️ API not responding yet"

  # ===========================================================================
  # JOB 4: Notify Status
  # ===========================================================================
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ All checks passed!"
            echo "📦 Model in prod_models/ will be served by API"
          else
            echo "❌ Some checks failed"
            exit 1
          fi
