# Mission7 CI/CD - Simple Deploy
name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
          
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlruns.db"
          DB_PATH: "./dataset/home_credit.db"
          USE_POSTGRES: "false"
          PYTHONPATH: ${{ github.workspace }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ~/projects/mission7
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build
            docker network connect web_network mission7_nginx_prod 2>/dev/null || true
            docker network connect web_network mission7_mlflow_prod 2>/dev/null || true
