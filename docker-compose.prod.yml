# Production-only Docker Compose for Lightsail deployment
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: mission7_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mission7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission7pass}
      POSTGRES_DB: ${POSTGRES_DB:-credit_scoring}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5470:5432"
    networks:
      - mission7_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission7 -d credit_scoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow-prod:
    build: .
    container_name: mission7_mlflow_prod
    command: mlflow server --host 0.0.0.0 --port 5002 --backend-store-uri /app/mlruns --default-artifact-root /app/mlruns --serve-artifacts
    ports:
      - "5072:5002"
    volumes:
      - ./mlruns:/app/mlruns
      - ./prod_models:/app/prod_models
    networks:
      - mission7_prod_net
    restart: unless-stopped

  api:
    build: .
    container_name: mission7_api
    command: gunicorn --bind 0.0.0.0:8000 --timeout 120 --workers 2 src.api.app:app
    ports:
      - "8070:8000"
    volumes:
      - .:/app
      - ./mlruns:/app/mlruns
      - ./prod_models:/app/prod_models
      - ./dataset:/app/dataset
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-prod:5002
      - DB_URI=postgresql://${POSTGRES_USER:-mission7}:${POSTGRES_PASSWORD:-mission7pass}@postgres:5432/${POSTGRES_DB:-credit_scoring}
      - PROD_MODEL_PATH=/app/prod_models/model.pkl
      - USE_POSTGRES=true
    depends_on:
      postgres:
        condition: service_healthy
      mlflow-prod:
        condition: service_started
    networks:
      - mission7_prod_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mission7_nginx
    ports:
      - "8071:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/api/templates:/usr/share/nginx/html:ro
    depends_on:
      - api
      - mlflow-prod
    networks:
      - mission7_prod_net
    restart: unless-stopped

networks:
  mission7_prod_net:
    driver: bridge

volumes:
  postgres_data:
