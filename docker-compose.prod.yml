# =============================================================================
# Mission7 Production Stack - 3-Tier Architecture with PostgreSQL
# =============================================================================
#
# Architecture:
#   Nginx (80) → API (8000) → PostgreSQL (5432)
#                          → Model from prod_models/ OR MLflow Serving (5003)
#                          → MLflow Registry (5002)
#
# MLflow Serving Mode (optional):
#   Set USE_MLFLOW_SERVING=true to use MLflow Model Serving instead of pickle
#   This enables the custom PyFunc model with SHAP explanations
#
# CI/CD Flow:
#   1. Push to main → GitHub Actions triggers
#   2. Tests run (pytest)
#   3. Lightsail: git pull origin main
#   4. docker compose -f docker-compose.prod.yml up -d --build
#   5. API loads model from prod_models/ (or MLflow Serving if enabled)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# =============================================================================

services:
  # ==========================================================================
  # PostgreSQL - Client Database (Port 5432, internal)
  # Stores client data for lookup queries
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: mission7_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mission7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission7pass}
      POSTGRES_DB: ${POSTGRES_DB:-credit_scoring}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - database
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mission7 -d credit_scoring" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # NGINX - Reverse Proxy & Dashboard (Port 80)
  # Serves the dashboard HTML and proxies API/MLflow requests
  # NOT exposed externally - only accessible via datascience_adventure proxy
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: mission7_nginx_prod
    restart: unless-stopped
    # No external port - only accessible via web_network from datascience_adventure
    expose:
      - "80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/templates:/usr/share/nginx/html:ro
      - ./app/static:/app/static:ro
    depends_on:
      - api
    networks:
      - frontend
      - backend
      - web_network  # Connect to datascience_adventure
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # API - Flask Prediction Service (Port 8000, internal)
  # Loads model from prod_models/ and queries PostgreSQL for client data
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: mission7_api_prod
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./prod_models:/app/prod_models:ro
      - ./dataset:/app/dataset:ro
      - ./src:/app/src:ro
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5002
      - PROD_MODEL_PATH=/app/prod_models/model.pkl
      - USE_POSTGRES=true
      - USE_MLFLOW_SERVING=${USE_MLFLOW_SERVING:-false}
      - MLFLOW_SERVING_URI=http://mlflow-serve:5003
      - DB_URI=postgresql://${POSTGRES_USER:-mission7}:${POSTGRES_PASSWORD:-mission7pass}@postgres:5432/${POSTGRES_DB:-credit_scoring}
      - DB_PATH=/app/dataset/home_credit.db
      - FLASK_ENV=production
      - PYTHONPATH=/app:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - backend
      - database
      - middleware
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # MLFLOW - Model Registry (Port 5002, internal)
  # Tracks experiments and model versions
  # ==========================================================================
  mlflow:
    build: .
    container_name: mission7_mlflow_prod
    restart: unless-stopped
    command: >
      mlflow server  --host 0.0.0.0  --port 5002  --backend-store-uri /app/mlruns  --default-artifact-root /app/mlruns  --serve-artifacts --allowed-hosts "*"
    expose:
      - "5002"
    volumes:
      - ./mlruns:/app/mlruns
      - ./prod_models:/app/prod_models:ro
    networks:
      - backend
      - middleware
      - web_network  # Connect to datascience_adventure

  # ==========================================================================
  # MLFLOW SERVING - Model Inference with SHAP (Port 5003, internal)
  # Serves the custom PyFunc model with built-in SHAP explanations
  # Enable with USE_MLFLOW_SERVING=true
  # ==========================================================================
  mlflow-serve:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: mission7_mlflow_serve_prod
    restart: unless-stopped
    profiles:
      - mlflow-serving # Only starts with --profile mlflow-serving or USE_MLFLOW_SERVING
    command: >
      mlflow models serve --model-uri /app/prod_models --host 0.0.0.0 --port 5003 --no-conda
    expose:
      - "5003"
    volumes:
      - ./prod_models:/app/prod_models:ro
      - ./app/config:/app/config:ro
      - ./scripts:/app/scripts:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5002
      - PYTHONPATH=/app:/app/src
    depends_on:
      - mlflow
    networks:
      - middleware
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5003/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  frontend:
    driver: bridge
  middleware:
    driver: bridge
  backend:
    driver: bridge
  database:
    driver: bridge
  # External network to connect with datascience_adventure
  web_network:
    external: true

volumes:
  postgres_data:
