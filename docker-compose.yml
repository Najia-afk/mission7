# =============================================================================
# Mission7 Development Stack - Jupyter + MLflow for local notebook work
# =============================================================================
#
# Usage:
#   docker compose up -d
#
# For production, use:
#   docker compose -f docker-compose.prod.yml up -d
#
# =============================================================================

services:
  jupyter:
    build: .
    container_name: mission7_jupyter
    ports:
      - "8870:8888"
    volumes:
      - .:/app
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5005
      - DB_PATH=/app/dataset/home_credit.db
    depends_on:
      - mlflow
    networks:
      - mission7_net

  mlflow:
    build: .
    container_name: mission7_mlflow_dev
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5005 
      --backend-store-uri /app/mlruns 
      --default-artifact-root /app/mlruns 
      --serve-artifacts
      --allowed-hosts "*"
    ports:
      - "5075:5005"
    volumes:
      - ./mlruns:/app/mlruns
    networks:
      - mission7_net

networks:
  mission7_net:
    driver: bridge
