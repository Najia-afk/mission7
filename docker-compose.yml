services:
  # =============================================================================
  # PRODUCTION SERVICES (for Lightsail deployment)
  # =============================================================================
  
  postgres:
    image: postgres:15-alpine
    container_name: mission7_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mission7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission7pass}
      POSTGRES_DB: ${POSTGRES_DB:-credit_scoring}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5470:5432"
    networks:
      - mission7_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission7 -d credit_scoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - prod

  mlflow-prod:
    build: .
    container_name: mission7_mlflow_prod
    command: mlflow server --host 0.0.0.0 --port 5002 --backend-store-uri /app/mlruns --default-artifact-root /app/mlruns --serve-artifacts
    ports:
      - "5072:5002"
    volumes:
      - ./mlruns:/app/mlruns
      - ./prod_models:/app/prod_models
    networks:
      - mission7_net
    profiles:
      - prod

  api:
    build: .
    container_name: mission7_api
    command: gunicorn --bind 0.0.0.0:8000 --timeout 120 --workers 2 app.wsgi:app
    ports:
      - "8070:8000"
    volumes:
      - .:/app
      - ./mlruns:/app/mlruns
      - ./prod_models:/app/prod_models
      - ./dataset:/app/dataset
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow-prod:5002
      - DB_URI=postgresql://${POSTGRES_USER:-mission7}:${POSTGRES_PASSWORD:-mission7pass}@postgres:5432/${POSTGRES_DB:-credit_scoring}
      - PROD_MODEL_PATH=/app/prod_models/model.pkl
      - USE_POSTGRES=${USE_POSTGRES:-false}
      - DB_PATH=/app/dataset/home_credit.db
    depends_on:
      - mlflow-dev
    networks:
      - mission7_net

  nginx:
    image: nginx:alpine
    container_name: mission7_nginx
    ports:
      - "8071:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/api/templates:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - mission7_net
    profiles:
      - prod

  # =============================================================================
  # DEVELOPMENT SERVICES (default, for local notebook work)
  # =============================================================================

  jupyter:
    build: .
    container_name: mission7_jupyter
    ports:
      - "8870:8888"
    volumes:
      - .:/app
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-dev:5005
      - DB_PATH=/app/dataset/home_credit.db
    depends_on:
      - mlflow-dev
    networks:
      - mission7_net

  mlflow-dev:
    build: .
    container_name: mission7_mlflow_dev
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5005 
      --backend-store-uri /app/mlruns 
      --default-artifact-root /app/mlruns 
      --serve-artifacts
      --allowed-hosts "*"
    ports:
      - "5075:5005"
    volumes:
      - ./mlruns:/app/mlruns
    networks:
      - mission7_net

networks:
  mission7_net:
    driver: bridge

volumes:
  postgres_data:
