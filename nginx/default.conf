# Mission7 Nginx Configuration
# HTTP-only reverse proxy for local development and Lightsail deployment

upstream api_backend {
    server api:8000;
}

upstream mlflow_backend {
    # Works for both dev (mlflow-dev) and prod (mlflow) containers
    server mlflow:5002;
}

server {
    listen 80;
    server_name localhost;
    
    # Increase timeouts for ML predictions
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # Increase body size for large prediction requests
    client_max_body_size 10M;
    
    # ==========================================================================
    # Static Assets - CSS, JS, Images
    # ==========================================================================
    
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # Proper MIME types
        types {
            text/css css;
            application/javascript js;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
        }
    }
    
    # ==========================================================================
    # HTML Pages - Proxy to Flask for template rendering
    # ==========================================================================
    
    location = / {
        proxy_pass http://api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = /predict {
        proxy_pass http://api_backend/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = /predict-test {
        proxy_pass http://api_backend/predict-test;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = /simulator {
        proxy_pass http://api_backend/simulator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = /audit {
        proxy_pass http://api_backend/audit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = /runs {
        proxy_pass http://api_backend/runs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = /dashboard {
        proxy_pass http://api_backend/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ==========================================================================
    # API Endpoints - Proxy to Flask
    # ==========================================================================
    
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers for API access
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }
    
    # POST prediction endpoint (for form submissions)
    location = /predict {
        if ($request_method = POST) {
            proxy_pass http://api_backend/predict;
        }
        proxy_pass http://api_backend/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Allow longer timeout for SHAP computation
        proxy_read_timeout 300s;
    }
    
    # ==========================================================================
    # MLflow UI - Proxy to MLflow server
    # ==========================================================================
    
    location /mlflow/ {
        proxy_pass http://mlflow_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # MLflow static assets
        proxy_set_header X-Script-Name /mlflow;
    }
    
    # MLflow API endpoints
    location /mlflow/api/ {
        proxy_pass http://mlflow_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # MLflow static files
    location /mlflow/static-files/ {
        proxy_pass http://mlflow_backend/static-files/;
        proxy_set_header Host $host;
    }
    
    # ==========================================================================
    # Health Check
    # ==========================================================================
    
    location /health {
        proxy_pass http://api_backend/api/health;
        proxy_set_header Host $host;
    }
    
    # Nginx status (for monitoring)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.0.0.0/8;  # Docker network
        deny all;
    }
    
    # ==========================================================================
    # Error Pages
    # ==========================================================================
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # ==========================================================================
    # Logging
    # ==========================================================================
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
